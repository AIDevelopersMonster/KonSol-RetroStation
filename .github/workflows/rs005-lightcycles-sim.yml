name: RS-005 LIGHT CYCLES RTL simulation
on:
  pull_request:
    paths:
      - 'games/lightcycles-rgb/**'
      - '.github/workflows/rs005-lightcycles-sim.yml'
  push:
    branches: [main]
    paths:
      - 'games/lightcycles-rgb/**'
      - '.github/workflows/rs005-lightcycles-sim.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iverilog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Compile and run gameplay tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs005
          iverilog -g2012 -Wall -s tb_lightcycles_rgb_core -o /tmp/rs005/sim \
            games/lightcycles-rgb/rtl/lightcycles_rgb_core.v \
            games/lightcycles-rgb/tests/tb_lightcycles_rgb_core.v
          vvp /tmp/rs005/sim | tee /tmp/rs005/result.log
          grep -q 'RS005_LIGHTCYCLES_TB_PASS' /tmp/rs005/result.log
